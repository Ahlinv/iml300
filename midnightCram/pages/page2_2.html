<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>The branching path</title>
        <link rel="stylesheet" href="../style.css"/>
        <script src="https://cdn.jsdelivr.net/npm/p5@2.3.4/lib/p5.js"></script>
        <script src="../jsFile/procras2_3.js"></script>
        <script src="../jsFile/timer.js"></script>
    </head>
    <body>
        <div class="eventText">
            <p>You for sure can't finish this in time by this point.</p>
        </div>
        <div class="button-container">
  <span class="button-label">Procrastinate↓</span>
            
  <!-- Button 1: Procrastinate Option (-10 seconds) -->
<a href="page2_3.html" class="procrastinate-btn custom-box-button" button>Better to give up now, waste no more effort</a>
<span class="button-label">Stop and breathe for a moment↓</span>

<!-- Button 2: Recovery Option (-20 seconds) -->
<a href="page3.html" class="recover-btn custom-box-button" button>Restore some energy can't be bad</a>
            <span class="button-label">Maybe there is still a chance...↓</span>
    <a href="page4.html" button class="custom-box-button">You have to finish it in time, right?</a>
</div>
        
    <div class="timer-container">
  <!-- Circular SVG Progress Indicator -->
  <svg class="clock-svg" viewBox="0 0 100 100">
    <!-- Background circle -->
    <circle class="clock-bg" cx="50" cy="50" r="45"></circle>
    <!-- Animated countdown ring -->
    <circle class="clock-ring" id="progress-ring" cx="50" cy="50" r="45"></circle>
  </svg>
  <!-- Text inside the clock -->
  <div id="countdown-text" class="timer-text">Loading...</div>
</div>
    
    </body>
</html>
